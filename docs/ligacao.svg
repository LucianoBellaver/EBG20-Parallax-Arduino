<svg xmlns="http://www.w3.org/2000/svg" width="860" height="355" viewBox="0 0 860 355" role="img" aria-labelledby="title desc">
<title id="title">Ligação entre Arduino e servo Parallax de rotação contínua</title>
<desc id="desc">Fio branco do servo conectado ao pino D9 do Arduino. Fio vermelho à alimentação regulada de 5 volts. Fio preto ao GND, comum ao Arduino.</desc>
<rect width="860" height="355" fill="#f7f9fc"/>
<rect x="30" y="75" width="235" height="224" rx="18" fill="#eaf5ff" stroke="#327ab4" stroke-width="3"/>
<text x="147" y="111" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#183b57" text-anchor="middle">Arduino</text>
<text x="147" y="140" font-family="Arial,sans-serif" font-size="14" fill="#355b71" text-anchor="middle">UNO / Nano (exemplo)</text>
<circle cx="245" cy="178" r="8" fill="white" stroke="#327ab4" stroke-width="3"/>
<text x="226" y="183" font-family="Arial,sans-serif" font-size="16" fill="#183b57" text-anchor="end">D9</text>
<circle cx="245" cy="247" r="8" fill="white" stroke="#327ab4" stroke-width="3"/>
<text x="226" y="252" font-family="Arial,sans-serif" font-size="16" fill="#183b57" text-anchor="end">GND</text>
<rect x="578" y="75" width="250" height="224" rx="18" fill="#fff4e8" stroke="#c47a26" stroke-width="3"/>
<text x="703" y="110" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#69401d" text-anchor="middle">Servo Parallax</text>
<text x="703" y="137" font-family="Arial,sans-serif" font-size="14" fill="#744f2d" text-anchor="middle">Rotação contínua (3 fios)</text>
<circle cx="598" cy="178" r="8" fill="white" stroke="#c47a26" stroke-width="3"/>
<circle cx="598" cy="217" r="8" fill="#d44e45" stroke="#c47a26" stroke-width="2"/>
<circle cx="598" cy="247" r="8" fill="#262626" stroke="#c47a26" stroke-width="2"/>
<text x="622" y="183" font-family="Arial,sans-serif" font-size="16" fill="#69401d">Branco — sinal</text>
<text x="622" y="222" font-family="Arial,sans-serif" font-size="16" fill="#69401d">Vermelho — +5 V</text>
<text x="622" y="252" font-family="Arial,sans-serif" font-size="16" fill="#69401d">Preto — GND</text>
<path d="M253 178 H590" fill="none" stroke="#6d85a0" stroke-width="5" stroke-linecap="round"/>
<text x="405" y="166" font-family="Arial,sans-serif" font-size="14" fill="#3d5368" text-anchor="middle">Sinal (branco)</text>
<path d="M253 247 H590" fill="none" stroke="#292c30" stroke-width="5" stroke-linecap="round"/>
<text x="400" y="272" font-family="Arial,sans-serif" font-size="14" fill="#35393d" text-anchor="middle">Terra comum (preto)</text>
<rect x="315" y="20" width="225" height="68" rx="10" fill="#fce5e3" stroke="#d44e45" stroke-width="2"/>
<text x="427" y="45" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#812b27" text-anchor="middle">Fonte externa regulada</text>
<text x="427" y="68" font-family="Arial,sans-serif" font-size="15" fill="#812b27" text-anchor="middle">+5 V (corrente adequada)</text>
<path d="M540 54 H554 V217 H590" fill="none" stroke="#d44e45" stroke-width="5" stroke-linecap="round"/>
<path d="M350 88 V247" fill="none" stroke="#292c30" stroke-width="3" stroke-dasharray="7 7"/>
<circle cx="350" cy="247" r="5" fill="#292c30"/>
<text x="22" y="333" font-family="Arial,sans-serif" font-size="13" fill="#425466">OBS: não ligue a fonte externa ao VIN do Arduino; desligue tudo antes de modificar a fiação.</text>
</svg>
